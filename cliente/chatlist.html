<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Conversas</title>
    <style>
        body {
            font-family: "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background: #f0f2f5;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 10px;
        }
        h1 {
            text-align: center;
            margin: 16px 0;
            color: #333;
        }
        .conversation {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: #fff;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .conversation:hover {
            background: #e5e5e5;
        }
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .meta {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .meta .name {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .meta .last-msg {
            font-size: 14px;
            color: #555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .time {
            font-size: 12px;
            color: #999;
            margin-left: 8px;
            flex-shrink: 0;
        }
        .conv-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conversas</h1>

        <!-- Example conversations -->
        <div class="conversation" onclick="openChat('debora')">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=400&auto=format&fit=crop" alt="Debora">
            </div>
            <div class="meta">
                <div class="conv-row">
                    <div class="name">Debora</div>
                    <div class="time">09:19</div>
                </div>
                <div class="last-msg">Recebi sim, obrigado! 😊</div>
            </div>
        </div>

        <div class="conversation" onclick="openChat('joao')">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=400&auto=format&fit=crop" alt="João">
            </div>
            <div class="meta">
                <div class="conv-row">
                    <div class="name">João</div>
                    <div class="time">08:45</div>
                </div>
                <div class="last-msg">Oi! Você já recebeu a entrega?</div>
            </div>
        </div>

        <div class="conversation" onclick="openChat('maria')">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=400&auto=format&fit=crop" alt="Maria">
            </div>
            <div class="meta">
                <div class="conv-row">
                    <div class="name">Maria</div>
                    <div class="time">Ontem</div>
                </div>
                <div class="last-msg">Ok, combinado! 👍</div>
            </div>
        </div>

    </div>

    <script>
        function openChat(user) {
            // redireciona para a página do chat (pode passar como query string)
            window.location.href = `chat.html?user=${user}`;
        }
    </script>
</body>
</html>
