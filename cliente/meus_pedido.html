<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Meus Pedidos</title>
    <link rel="stylesheet" href="cssbase.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
           body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            padding-bottom: 60px;
            background-image: url('morango.jpg');
            background-repeat: no-repeat;
            background-position: top center;
           background-size: 100% 700px; 
        }



        .container {
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 15px;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
            color: #333;
        }

        .card p {
            margin: 4px 0;
            font-size: 14px;
            color: #555;
        }

        .status {
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 6px;
            display: inline-block;
            font-size: 13px;
        }

        .Atendido {
            background: #d4edda;
            color: #155724;
        }

        .Cancelado {
            background: #f8d7da;
            color: #721c24;
        }

        .Parcial {
            background: #fff3cd;
            color: #856404;
        }
    </style>
</head>

<body>
    <div class="espaco"></div>
    <header>

        <a href="chatlist.html"><i class="fa-solid fa-comments"></i></a>

    </header>
    <div class="container" id="listaPedidos">
        <!-- Cards serão adicionados aqui via JavaScript -->
    </div>

    <div class="navbar">
        <div><a href="index.html"><span class="icon icon-home"></span></a><span>Home</span></div>
        <div><a href="buscas.html"><span class="icon icon-search"></span></a><span>Buscar</span></div>
        <div><a href="meus_pedido.html"><span class="icon icon-cart"></span></a><span>Pedidos</span></div>
        <div><a href="user_config.html"><span class="icon user-icon"></span></a><span><span></span>Menu</span></span>
        </div>
    </div>

    <script>
        const pedidos = [
            { produto: 'Morango', quantidade: 2, medida: 'kg', dataPrevista: '2025-09-15', status: 'Atendido' },
            { produto: 'Banana', quantidade: 5, medida: 'kg', dataPrevista: '2025-09-16', status: 'Parcial' },
            { produto: 'Uva', quantidade: 3, medida: 'kg', dataPrevista: '2025-09-17', status: 'Cancelado' },
            { produto: 'Abacaxi', quantidade: 1, medida: 'un', dataPrevista: '2025-09-18', status: 'Atendido' }
        ];

        const container = document.getElementById('listaPedidos');

        pedidos.forEach(pedido => {
            const card = document.createElement('div');
            card.classList.add('card');
            card.innerHTML = `
                <h3>${pedido.produto}</h3>
                <p>Quantidade: ${pedido.quantidade} ${pedido.medida}</p>
                <p>Data Prevista: ${pedido.dataPrevista}</p>
                <p>Status: <span class="status ${pedido.status}">${pedido.status}</span></p>
            `;
            container.appendChild(card);
        });
        const currentPage = window.location.pathname.split("/").pop();
        const navDivs = document.querySelectorAll(".navbar div");

        navDivs.forEach(div => {
            const link = div.querySelector("a");
            if (link && link.getAttribute("href") === currentPage) {
                div.classList.add("active");
            }
        });

    </script>
</body>

</html>
