<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Configurações do Usuário</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cssbase.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        crossorigin="anonymous">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            padding-bottom: 60px;
            background-image: url('morango.jpg');
            background-repeat: no-repeat;
            background-position: top center;
            background-size: 100% 700px;
        }



        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .profile-header img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #4CAF50;
        }

        .profile-header .greeting {
            font-size: 16px;
            font-weight: bold;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card button {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-edit {
            background: #2196F3;
            color: white;
        }

        .btn-save {
            background: #4CAF50;
            color: white;
        }

        .data-view {
            margin-bottom: 10px;
            font-size: 14px;
        }

        .data-view span {
            font-weight: bold;
        }

        .card input,
        .card select {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="espaco"></div>
 <header>

        <a href="chatlist.html"><i class="fa-solid fa-comments"></i></a>

    </header>
    <div class="container">
        <!-- Perfil -->
        <div class="profile-header">
            <img src="https://randomuser.me/api/portraits/women/65.jpg" alt="Foto do usuário" id="fotoUsuario">

            <div class="greeting" id="greetingUsuario">Olá, Debora Machado</div>
        </div>

        <!-- Conta -->
        <div class="card" id="cardConta">
            <h2>
                Conta
                <button class="btn-edit" onclick="editarConta()">Editar</button>
            </h2>
            <div class="data-view" id="viewEmail"><span>E-mail:</span> machadoDebora@email.com</div>
            <div class="data-view" id="viewSenha"><span>Senha:</span> ********</div>
        </div>

        <!-- Dados Pessoais -->
        <div class="card" id="cardDados">
            <h2>
                Dados Pessoais
                <button class="btn-edit" onclick="editarDados()">Editar</button>
            </h2>
            <div class="data-view" id="viewNome"><span>Nome:</span> Debora Machado</div>
            <div class="data-view" id="viewDocumento"><span>Documento CPF/CNPJ:</span> 123.456.789-00</div>

            <div class="data-view" id="viewEndereco">
                <span>Endereço:</span> Rua Exemplo, 123, Bairro, Cidade, Estado, País, CEP, Complemento
            </div>
        </div>
    </div>

    <div class="navbar">
        <div><a href="index.html"><span class="icon icon-home"></span></a><span>Home</span></div>
        <div><a href="buscas.html"><span class="icon icon-search"></span></a><span>Buscar</span></div>
        <div><a href="meus_pedido.html"><span class="icon icon-cart"></span></a><span>Pedidos</span></div>
        <div><a href="user_config.html"><span class="icon user-icon"></span></a><span>Menu</span></div>
    </div>

    <script>
        const currentPage = window.location.pathname.split("/").pop();
        const navDivs = document.querySelectorAll(".navbar div");

        navDivs.forEach(div => {
            const link = div.querySelector("a");
            if (link && link.getAttribute("href") === currentPage) {
                div.classList.add("active");
            }
        });
        function editarConta() {
            const card = document.getElementById('cardConta');
            card.innerHTML = `
                <h2>Conta</h2>
                <label for="email">E-mail</label>
                <input type="email" id="email" value="usuario@email.com">
                <label for="senha">Senha atual</label>
                <input type="password" id="senha" value="123456">
                <label for="novaSenha">Nova senha</label>
                <input type="password" id="novaSenha" placeholder="Nova senha">
                <button class="btn-save" onclick="salvarConta()">Salvar Alterações</button>
            `;
        }

        function editarDados() {
            const card = document.getElementById('cardDados');
            card.innerHTML = `
                <h2>Dados Pessoais</h2>
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" value="João Silva">
                <label for="documento">Documento (CPF / RG)</label>
                <input type="text" id="documento" value="123.456.789-00">
                <label for="pix">Chave Pix</label>
                <input type="text" id="pix" value="joao@email.com">
                
                <label for="rua">Rua</label>
                <input type="text" id="rua" value="Rua Exemplo">
                <label for="numero">Número</label>
                <input type="text" id="numero" value="123">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" value="Bairro Exemplo">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" value="Cidade Exemplo">
                <label for="estado">Estado</label>
                <input type="text" id="estado" value="Estado Exemplo">
                <label for="pais">País</label>
                <input type="text" id="pais" value="Brasil">
                <label for="cep">CEP</label>
                <input type="text" id="cep" value="12345-678">
                <label for="complemento">Complemento</label>
                <input type="text" id="complemento" value="Apartamento 101">

                <button class="btn-save" onclick="salvarDados()">Salvar Dados</button>
            `;
        }

        function salvarConta() {
            alert('Alterações da conta salvas!');
            location.reload();
        }

        function salvarDados() {
            alert('Dados pessoais salvos!');
            location.reload();
        }


    </script>
</body>

</html>
