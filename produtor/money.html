<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cssbase.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        crossorigin="anonymous">


    <title>Document</title>
    <style>
         body {
             background-image: url('fruta.jpg');
            background-size: contain;
            position: relative;
            background-repeat: no-repeat;
            background-position: top center;
            background-size: 100% 700px;
        }

        header {
            background: rgba(78, 78, 78, 0.447);
            position: fixed;
            right: 7vw;
            width: 100px;
            top: 2vh;
            padding: 7px 15px;
            border-radius: 10px;
        }

        .aaaaaaaaaaaa {
            height: 12vh;
            width: 100%;
        }

        .content {
            width: 95%;
            background-color: white;
            margin: auto;
            border-radius: 20px 20px 0px 0px;
            padding: 20px;
            height: 100%;
            height: 100%;
            border: 1px solid rgb(175, 175, 175);
        }

        .content p {
            font-family: Arial, Helvetica, sans-serif;
            font-size: .8rem;
            font-weight: 600;
        }

        .content h1,
        .content h2 {
            font-size: 1.2rem;
        }

        .content h2 {
            margin-top: 25px;

        }

        .info {
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            width: 100%;
            height: 10vh;
            align-content: stretch;
            margin-bottom: 10px;
        }

        .info .item {
            display: flex;
            align-items: start;
            justify-content: space-evenly;
            flex-direction: column;
            flex: 1;
            padding: 10px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.253);

            gap: 5px;

        }

        .stview,
        .neg {
            width: 75%;

            background-color: rgb(35, 161, 145);
        }

        .stview {
            border-radius: 20px;
            width: 75%;
            height: 15px;
        }

        .neg {
            border-radius: 20px;
            font-weight: 500;
            padding: 4px 7px;
            text-align: center;
            margin: auto;
            color: white;
            font-size: 0.7rem;
        }

        .nd,
        .na {
            display: flex;
            align-items: center;
            justify-content: start;
            gap: 5px;
            flex-direction: column;
            margin-bottom: 10px;
        }

        .cust {

            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.253);

            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
        }

        .cust .item {
            display: flex;
            align-items: center;
            justify-content: space-evenly;

            min-width: 20%;
        }

        .cust .item:nth-child(1) {
            gap: 5px;

            flex-direction: column;

        }

        .cInfo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .cInfo>div {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .content .img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgb(220, 220, 220);
        }

        .name {
            font-size: 1rem !important;
        }

        h3 {
            text-align: center;
            margin-top: 20px;
        }

        .btns {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 5px;
        }

        .btns button {
            width: 40%;
            height: 25px;
            border: none;
            border-radius: 3px;
            background-color: transparent;
        }

        .btns .add {
            border: 2px solid rgb(0, 96, 181);
        }

        .btns .rm {
            border: 2px solid rgb(176, 0, 0);
        }

        h4 {
            margin-top: 50px;
        }

        .rasItem {
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.253);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

    <div>
        <div class="aaaaaaaaaaaa">
            <header>

                <a href="../cliente/chatlist.html"><i class="fa-solid fa-comments"></i></a>

            </header>
        </div>
        <div class="content">
            <h1>Financeiro</h1>
            <div id="chart_div" style="width: 100%; height: 500px;"></div>
        </div>
        <div class="navbar">
          <div><a href="buscaProd.html"><span class="icon icon-home"></span></a><span>Home</span></div>
            <div>
                <a href="index.html"><i class="fa-solid fa-cart-shopping"></i></a>
                <span>Pedidos</span>
            </div>
            <div>
                <a href="estoque.html"><i class="fa-solid fa-box"></i></a>
                <span>Estoque</span>
            </div>
            <div>
                <a href="money.html"><i class="fa-solid fa-dollar-sign"></i></a>
                <span>Financeiro</span>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
        google.charts.load('current', { 'packages': ['corechart'] });
        google.charts.setOnLoadCallback(drawVisualization);

        function drawVisualization() {
            var data = google.visualization.arrayToDataTable([
                ['Semana', 'Morango', 'Laranja', 'Banana', 'Média'],
                ['Semana 1', 30, 45, 60, 45],
                ['Semana 2', 40, 50, 65, 52],
                ['Semana 3', 35, 55, 70, 53],
                ['Semana 4', 45, 60, 75, 60]
            ]);

            var options = {
                title: 'Produção Semanal de Frutas (Kg) - Janeiro',
                vAxis: { title: 'Produção (Kg)', viewWindow: { min: 0, max: 100 } },
                hAxis: { title: 'Semana' },
                seriesType: 'bars',
                series: { 3: { type: 'line', color: '#ff6600' } }, // linha da média
                legend: { position: 'bottom' },
                colors: ['#e63946', '#f4a261', '#2a9d8f'],
                chartArea: {
                    left: 60,
                    top: 50,
                    width: '100%',
                    height: '70%'
                }
            };

            var chart = new google.visualization.ComboChart(document.getElementById('chart_div'));
            chart.draw(data, options);

            // Responsivo
            window.addEventListener('resize', function () {
                chart.draw(data, options);
            });
        }
    </script>
</body>

</html>
